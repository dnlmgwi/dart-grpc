syntax = "proto3";

package greeter;

// The greeting service definition
service Greeter {
  // Unary RPC: sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply) {}

  // Server streaming RPC: sends multiple greetings
  rpc SayHelloStream (HelloRequest) returns (stream HelloReply) {}

  // Client streaming RPC: receives multiple names and sends one greeting
  rpc SayHelloClientStream (stream HelloRequest) returns (HelloReply) {}

  // Bidirectional streaming RPC: interactive conversation
  rpc SayHelloBidirectional (stream HelloRequest) returns (stream HelloReply) {}
}

// The request message containing the user's name
message HelloRequest {
  string name = 1;
}

// The response message containing the greeting
message HelloReply {
  string message = 1;
}
